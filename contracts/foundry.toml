[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Monad supports EIP-7702 (transaction type 0x04). Tests that exercise the delegated path
# need a Prague-or-later EVM for vm.signDelegation / vm.attachDelegation.
[profile.seventy_o_two]
evm_version = "prague"

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
